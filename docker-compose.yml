# =============================================================================
# Docker Compose - DevOps Student Engineering Portal
# Lab 4: Multi-container application with networking and storage
#
# Services:
#   1. frontend (nginx)  - Serves static HTML/CSS/JS + reverse proxy to API
#   2. api (Node.js)     - Backend REST API for student data
#   3. redis             - Data store for persistence validation
#
# Network: student-network (custom bridge)
# Volume: redis-data (named volume for persistence)
# =============================================================================

services:
  # ---------- Service 1: Frontend (nginx) ----------
  frontend:
    image: nginx:1.27-alpine
    container_name: student-portal-frontend
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - student-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3

  # ---------- Service 2: Backend API (Node.js) ----------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: student-portal-api
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    networks:
      - student-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck defined in api/Dockerfile

  # ---------- Service 3: Redis (Data Store) ----------
  redis:
    image: redis:7-alpine
    container_name: student-portal-redis
    volumes:
      - redis-data:/data
    networks:
      - student-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    command: redis-server --appendonly yes

# ---------- Networks ----------
networks:
  student-network:
    driver: bridge
    name: student-portal-network

# ---------- Volumes ----------
volumes:
  redis-data:
    driver: local
    name: student-portal-redis-data
