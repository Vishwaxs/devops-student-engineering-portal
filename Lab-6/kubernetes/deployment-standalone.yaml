apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-config-demo
  namespace: devops-lab6
  labels:
    app: student-config-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-config-demo
  template:
    metadata:
      labels:
        app: student-config-demo
    spec:
      containers:
        - name: student-app
          image: student-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: student-app-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: APP_USERNAME
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: APP_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: student-config-demo-svc
  namespace: devops-lab6
spec:
  type: NodePort
  selector:
    app: student-config-demo
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30085

