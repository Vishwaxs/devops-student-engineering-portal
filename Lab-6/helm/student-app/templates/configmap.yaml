apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "student-app.fullname" . }}-config
  labels:
    {{- include "student-app.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  APP_MODE: {{ .Values.config.appMode | quote }}
  PUBLIC_MESSAGE: {{ .Values.config.publicMessage | quote }}

