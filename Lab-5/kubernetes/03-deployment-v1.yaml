apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-k8s-app
  namespace: devops-lab5
  labels:
    app: student-k8s-app
    tier: frontend
    version: v1.0.0
  annotations:
    kubernetes.io/change-cause: "Initial release v1.0.0 with 2 replicas"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: student-k8s-app
      tier: frontend
  template:
    metadata:
      labels:
        app: student-k8s-app
        tier: frontend
        version: v1.0.0
    spec:
      tolerations:
      - operator: Exists
      containers:
      - name: student-k8s-app
        image: vishwaxs/student-k8s-app:v1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - node
        - -e
        - |
          const http = require('http');
          const server = http.createServer((req, res) => {
            if (req.url === '/healthz') {
              res.writeHead(200, {'Content-Type': 'application/json'});
              return res.end(JSON.stringify({status: 'UP', check: 'liveness', pod: process.env.POD_NAME}));
            }
            if (req.url === '/ready') {
              res.writeHead(200, {'Content-Type': 'application/json'});
              return res.end(JSON.stringify({status: 'READY', check: 'readiness', pod: process.env.POD_NAME}));
            }
            res.writeHead(200, {'Content-Type': 'application/json'});
            res.end(JSON.stringify({
              app: 'DevOps MCA Lab 5 - Kubernetes Portal',
              version: process.env.APP_VERSION || 'v1.0.0',
              pod: process.env.POD_NAME,
              namespace: process.env.POD_NAMESPACE,
              status: 'ACTIVE'
            }));
          });
          server.listen(8080, '0.0.0.0', () => console.log('Node server listening on port 8080'));
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_VERSION
          value: "v1.0.0"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        envFrom:
        - configMapRef:
            name: k8s-portal-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        # Self-Learning Concept: Liveness & Readiness Probes
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        # Self-Learning Concept: PreStop Hook for Zero-Downtime Connection Draining
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
