apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-k8s-app
  namespace: devops-lab5
  labels:
    app: student-k8s-app
    tier: frontend
    version: v2.0.0
  annotations:
    kubernetes.io/change-cause: "Release v2.0.0: Rolling update with emerald UI and enhanced telemetry"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: student-k8s-app
      tier: frontend
  template:
    metadata:
      labels:
        app: student-k8s-app
        tier: frontend
        version: v2.0.0
    spec:
      containers:
      - name: student-k8s-app
        image: vishwaxs/student-k8s-app:v2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_VERSION
          value: "v2.0.0"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        envFrom:
        - configMapRef:
            name: k8s-portal-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
